name: Android debug verification
on:
  push:
    branches:
      - main
      - 'nyra/**'
  workflow_dispatch:
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build, test and lint
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Nyra-0.2.0-debug-arm64
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            build.log
            app/build/reports/
            app/schemas/
          if-no-files-found: warn
